<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Archivist</title>
  <link rel="stylesheet" href="styles.css">
  <script src="popup.js"></script>
  <link rel="icon" type="image/png" href="logo_16.png">
  <link rel="icon" type="image/png" href="logo_32.png">
  <link rel="icon" type="image/png" href="logo_48.png">
  <link rel="icon" type="image/png" href="logo_128.png">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="logo_full.png" alt="Logo" class="logo">
      <h1 class="title">The Archivist</h1>
    </div>
    
    <div class="url-container">
      <div class="url-box">
        <div class="url-info">
          <div class="url-label">URL actuelle:</div>
          <div class="copy-wrapper">
            <button id="copyButton" title="Copier le lien" class="copy-button">
              <svg xmlns="http://www.w3.org/2000/svg" class="copy-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
              </svg>
            </button>
          </div>
        </div>
        <div id="currentUrl"></div>
        <div id="copyNotification" class="copy-notification">Lien copié !</div>
      </div>

      <div class="button-container">
        <button id="archiveButton">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
          </svg>
          Visualiser l'archive
        </button>
      </div>
    </div>
    
    <div class="footer">
      Accès direct à la dernière version archivée sur archive.ph
      <div class="github-link">
        <a href="https://github.com/Ka-be/thearchivist_extension" target="_blank" rel="noopener noreferrer" style="color: #64748b; transition: color 0.2s ease;" title="Voir le projet sur GitHub">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" class="github-icon">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
